name: Eastside Market Pulse

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These paired hours cover 8am, 2pm, and 8pm Pacific
    # across daylight-saving changes; the local-time guard skips the extra run.
    - cron: "0 3,4,15,16,21,22 * * *"

permissions:
  contents: read

concurrency:
  group: eastside-market-pulse
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Confirm Pacific report time
        id: schedule
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=America/Los_Angeles date +%H)"
          case "$hour" in
            08|14|20) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Generate aggregate market pulse
        if: steps.schedule.outputs.run == 'true'
        env:
          WEBSITE_MLS_DATA_URL: ${{ secrets.WEBSITE_MLS_DATA_URL }}
          WEBSITE_MLS_DATA_TOKEN: ${{ secrets.WEBSITE_MLS_DATA_TOKEN }}
        run: |
          node scripts/fetch-market-pulse.mjs >> "$GITHUB_STEP_SUMMARY"
