name: Sync Listings

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger MLS sync endpoint
        env:
          MLS_SYNC_URL: ${{ secrets.MLS_SYNC_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ -z "$MLS_SYNC_URL" ] || [ -z "$ADMIN_API_TOKEN" ]; then
            echo "MLS_SYNC_URL and ADMIN_API_TOKEN secrets are required."
            exit 1
          fi
          curl --fail --show-error --silent \
            --header "x-admin-token: $ADMIN_API_TOKEN" \
            "$MLS_SYNC_URL"
